name: Test use_local with missing local config file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with use_local and non-existent local config
        id: action
        uses: .
        with:
          token: ${{ github.token }}
          config: /nonexistent/path/that/does/not/exist/auto_request_review.yml
          use_local: 'true'
          # The action should exit gracefully (not fail) when local config is missing.
          # It catches the file-not-found error and logs a warning, then returns.
        continue-on-error: true
      - name: Assert action exited gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action exited gracefully (local config not found)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed (acceptable under act — no PR context)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
