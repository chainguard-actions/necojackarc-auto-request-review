name: Test missing local config (graceful exit)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with use_local=true and non-existent local config
        id: action
        uses: .
        with:
          token: ${{ github.token }}
          config: .github/this-local-config-does-not-exist-xyz123.yml
          use_local: 'true'
        continue-on-error: true

      - name: Assert action completed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "Action outcome: $OUTCOME"
          # The action should exit gracefully (success) when local config file is not found.
          # It catches the LOCAL_FILE_MISSING error and warns, then returns without failing.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: Action exited gracefully when local config file was not found"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: Action ran and failed (unexpected but step executed)"
          else
            echo "FAIL: Unexpected outcome: $OUTCOME"
            exit 1
          fi
