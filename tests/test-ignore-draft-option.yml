name: Test ignore_draft and ignored_keywords options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: wip-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create config with ignore_draft and ignored_keywords
        run: |
          mkdir -p .github
          cat > .github/auto_request_review.yml << 'EOF'
          reviewers:
            defaults:
              - octocat
            groups:
              all-reviewers:
                - octocat
                - hubot
          files:
            '**':
              - all-reviewers
          options:
            ignore_draft: true
            ignored_keywords:
              - DO NOT REVIEW
              - WIP
            enable_group_assignment: false
          EOF

      - id: action
        uses: .
        with:
          token: ${{ github.token }}
          config: .github/auto_request_review.yml
          use_local: 'true'
        continue-on-error: true

      - name: Assert action ran with ignore_draft config
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action may fail due to GitHub API limitations in act (no real PR context),
          # but it should not fail due to config parsing issues.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with ignore_draft config (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
