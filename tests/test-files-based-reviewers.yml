name: Test files-based reviewer assignment config
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create local config with files-based reviewer rules
        run: |
          mkdir -p .github
          cat > .github/auto_request_review.yml << 'EOF'
          reviewers:
            groups:
              frontend-team:
                - alice
                - bob
              backend-team:
                - charlie
                - dave
          files:
            '**/*.js':
              - frontend-team
            '**/*.ts':
              - frontend-team
            '**/*.go':
              - backend-team
            '**/*.py':
              - backend-team
          options:
            ignore_draft: false
            enable_group_assignment: false
            number_of_reviewers: 2
          EOF

      - name: Verify config file was created
        run: |
          if [ ! -f ".github/auto_request_review.yml" ]; then
            echo "FAIL: config file not created"
            exit 1
          fi
          echo "PASS: config file exists"
          cat .github/auto_request_review.yml

      - id: action
        name: Run auto-request-review with files-based config
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          config: .github/auto_request_review.yml
          use_local: 'true'
        env:
          GITHUB_EVENT_NAME: pull_request

      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "Action outcome: $OUTCOME"
          # The action may fail due to no real PR context in act,
          # but it should not fail due to config parsing issues.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with files-based config (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
