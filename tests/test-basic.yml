name: Test basic usage with token input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create auto_request_review config
        run: |
          mkdir -p .github
          cat > .github/auto_request_review.yml << 'EOF'
          reviewers:
            - necojackarc
          EOF

      - name: Run action (expect it to attempt review request)
        id: action
        continue-on-error: true
        uses: .
        with:
          token: ${{ github.token }}
          config: .github/auto_request_review.yml
          use_local: 'true'

      - name: Assert action was invoked with token input
        run: |
          echo "Action step outcome: ${{ steps.action.outcome }}"
          # The action may fail because there is no real PR in act environment,
          # but it must have been invoked (outcome is set, not skipped).
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action step was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action was invoked with token input"
