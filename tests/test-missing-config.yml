name: Test missing config file (graceful exit or API error)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with non-existent config file
        id: action
        uses: .
        with:
          token: ${{ github.token }}
          config: .github/this-config-does-not-exist-at-all.yml
          use_local: 'false'
          # The action should exit gracefully (not fail) when config is missing (404).
          # Under act, context.ref may point to a branch that doesn't exist
          # in the remote repo, which can cause a non-404 API error.
          # We accept both outcomes.
        continue-on-error: true
      - name: Assert action ran (success or expected failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action exited gracefully (config not found)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (API error under act environment)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
