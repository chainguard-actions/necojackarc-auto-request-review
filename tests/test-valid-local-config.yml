name: Test valid local config with use_local=true
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a valid local config file
        run: |
          mkdir -p .github
          cat > .github/auto_request_review.yml << 'EOF'
          reviewers:
            groups:
              engineers:
                - engineer_a
                - engineer_b
            defaults:
              - engineer_a
          options:
            ignore_draft: true
            ignored_keywords:
              - DO NOT REVIEW
          EOF

      - name: Run action with valid local config
        id: action
        uses: .
        with:
          token: ${{ github.token }}
          config: .github/auto_request_review.yml
          use_local: 'true'
        continue-on-error: true

      - name: Assert action ran (config was loaded successfully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "Action outcome: $OUTCOME"
          # The action loads the local config successfully.
          # Under workflow_dispatch there is no pull_request payload, so the action
          # will fail when trying to access context.payload.pull_request (TypeError).
          # This confirms the config was loaded and the action progressed past config loading.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: Action failed as expected (no PR context under workflow_dispatch)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: Action succeeded (handled missing PR context gracefully)"
          else
            echo "FAIL: Unexpected outcome: $OUTCOME"
            exit 1
          fi
