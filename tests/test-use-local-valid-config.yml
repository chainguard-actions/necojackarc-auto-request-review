name: Test use_local with valid config (no PR context)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create local config file in workspace
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/auto-review-config"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/auto-review-config/auto_request_review.yml" << 'EOF'
          reviewers:
            defaults:
              - octocat
            groups:
              team-a:
                - octocat
          files:
            '**/*.js':
              - team-a
          options:
            ignore_draft: true
            ignored_keywords:
              - DO NOT REVIEW
          EOF
      - name: Run action with use_local and valid local config (no PR context)
        id: action
        uses: .
        with:
          token: ${{ github.token }}
          config: ${{ github.workspace }}/tests/fixtures/auto-review-config/auto_request_review.yml
          use_local: 'true'
          # Under workflow_dispatch there is no pull_request context.
          # The action will fail trying to access context.payload.pull_request.
          # We expect this step to fail, so we use continue-on-error.
        continue-on-error: true
      - name: Assert action failed as expected (no PR context)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should fail because there is no pull_request context
          # under workflow_dispatch — this is expected behavior.
          # It may also succeed if the action handles missing PR context gracefully.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when no PR context is available"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action exited gracefully (may have handled missing PR context)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
